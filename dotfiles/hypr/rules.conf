# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]
windowrulev2 = opacity 0.95 0.95, class:^(org.gnome.Nautilus)$
windowrulev2 = workspace 10, class:^(discord)$
windowrulev2 = workspace special:magic, class:^(spotify)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = size 600 500, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = size 600 500, class:^(blueman-manager)$
windowrulev2 = float, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = size 800 600, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = float, class:^(btop_float)$
windowrulev2 = size 1000 600, class:^(btop_float)$
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = size 900 600, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = float, class:^(Bitwarden)$
windowrulev2 = size 900 600, class:^(Bitwarden)$
windowrulev2 = center, class:^(Bitwarden)$